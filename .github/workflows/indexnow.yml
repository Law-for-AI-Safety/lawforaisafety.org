name: IndexNow

on:
  push:
    branches: [main]

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Submit changed pages to IndexNow
        run: node scripts/indexnow.mjs "${{ github.event.before }}" "${{ github.sha }}"
